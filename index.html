<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead conversion: pod insights</title>
<style>
:root{--bg:#fbfbfa;--s:#f1f0ec;--t:#1c1c1a;--t2:#5b5a55;--b:#d9d7cf;--ac:#1f5fae;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a19;--s:#252523;--t:#f0efec;--t2:#b3b1a8;--b:#3a3a37;--ac:#6aa6ee}}
*{box-sizing:border-box}
body{margin:0 auto;padding:20px;background:var(--bg);color:var(--t);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1400px}
h1{font-size:22px;font-weight:600;margin:0}h2{font-size:15px;font-weight:600;margin:26px 0 8px}
.hd{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
#st{color:var(--t2);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--s);padding:12px;border-radius:8px;margin-top:8px}
button,input{font:inherit;color:var(--t)}
button,label.f{border:1px solid var(--b);background:var(--bg);padding:6px 12px;border-radius:6px;cursor:pointer}
button.pr{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5;cursor:default}
button:hover,label.f:hover{border-color:var(--ac)}:focus-visible{outline:2px solid var(--ac)}
label.set{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:5px}
input[type=number],input[type=text],input[type=password]{padding:5px 7px;border:1px solid var(--b);background:var(--bg);border-radius:6px}
input[type=number]{width:56px}input.w1{width:130px}
#ad{background:var(--s);border-radius:8px;padding:14px;margin-bottom:14px}#ad .r{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
#ad p{margin:0;color:var(--t2);font-size:12px}
.dz{border:1.5px dashed var(--b);border-radius:8px;padding:16px;text-align:center;color:var(--t2);background:var(--bg)}.dz.on{border-color:var(--ac)}
#msg,#gm{font-size:12px;color:var(--t2);margin-top:8px}.e{color:#d03b3b!important}.ok{color:#1a8a3a!important}
.pv{background:#fab219;color:#222;border-radius:6px;padding:6px 10px;font-size:12px;margin-bottom:10px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:14px}
.k div{background:var(--s);border-radius:8px;padding:10px 14px}.k span{font-size:12px;color:var(--t2);display:block}.k b{font-size:22px;font-weight:600}.k small{display:block;font-size:11px;color:var(--t2)}
.w{overflow-x:auto}table{border-collapse:separate;border-spacing:2px;width:100%;font-size:12px}
th{font-weight:500;color:var(--t2);font-size:11px;padding:2px 4px;text-align:center}
td{padding:5px 4px;text-align:center;border-radius:4px;min-width:62px}td.n{text-align:left;font-weight:600;background:none;min-width:90px}
.p{display:block;font-weight:600;font-size:13px}.s{display:block;font-size:10.5px;color:var(--t2)}
td.best{outline:2px solid var(--t);outline-offset:-2px}td.th .p{font-style:italic;font-weight:400}
tr.t td{background:none;color:var(--t2);font-size:11px}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--t2);margin-top:6px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
table.m{border-spacing:0}table.m th{text-align:left;border-bottom:1px solid var(--b);padding:5px 6px}table.m td{text-align:left;border-bottom:1px solid var(--b);border-radius:0;padding:5px 6px}table.m .r{text-align:right}

.hh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:26px 0 2px}.hh h2{margin:0}
.sub{font-size:12px;color:var(--t2);margin:0 0 8px}
.sg{display:flex;border:1px solid var(--b);border-radius:6px;overflow:hidden}.sg button{border:0;border-radius:0;border-right:1px solid var(--b);padding:5px 16px}.sg button:last-child{border-right:0}.sg button.on{background:var(--ac);color:#fff}
table.h th.n,table.h td.n{position:sticky;left:0;background:var(--bg);z-index:1}
td.c{text-align:left;padding:6px 9px;min-width:158px}
.r2{display:flex;justify-content:space-between;gap:10px;font-size:11px;line-height:1.6}.r2 span{color:var(--t2)}.r2 b{font-weight:500}
.r2.a{border-top:1px solid rgba(128,128,128,.35);margin-top:3px;padding-top:3px;font-size:13px}.r2.a span{color:var(--t)}.r2.a b{font-weight:600}.r2.a b.it{font-style:italic;font-weight:400}
td.rs{white-space:normal;min-width:340px;color:var(--t2)}
</style></head><body>
<div class="hd"><div><h1>Lead conversion: pod insights</h1><div id="st">Loading data...</div></div><button id="ub">Update data</button></div>

<div id="ad" hidden>
<div class="dz" id="dz">Drop the sheet CSV (or a data.json) here, or <label class="f" style="margin-left:6px">Choose file<input id="fi" type="file" accept=".csv,.json,text/csv,application/json" hidden></label></div>
<div id="msg"></div>
<div class="r">
<label class="set">Owner<input id="go" type="text" class="w1"></label>
<label class="set">Repo<input id="gr" type="text" class="w1"></label>
<label class="set">Branch<input id="gb" type="text" class="w1" value="main" style="width:70px"></label>
<label class="set">File<input id="gp" type="text" class="w1" value="data.json" style="width:100px"></label>
<label class="set">Token<input id="gt" type="password" class="w1" autocomplete="off"></label>
<label class="set"><input id="gk" type="checkbox"> Remember on this device</label>
</div>
<div class="r"><button id="pub" class="pr" disabled>Publish to GitHub</button><p>Replaces data.json in the repo. Everyone sees it after GitHub Pages rebuilds (about a minute).</p></div>
<div id="gm"></div>
</div>

<div class="bar">
<span style="flex:1;font-size:12px;color:var(--t2)">Re-routing rules</span>
<label class="set">Giver below %<input id="th" type="number" value="80"></label>
<label class="set">Move %<input id="mv" type="number" value="50"></label>
<label class="set">Receiver cap %<input id="cp" type="number" value="30"></label>
<label class="set">Min sales<input id="ms" type="number" value="5"></label>
</div>
<div id="out"></div>

<script>
function parseCSV(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}row.push(c);r.push(row);return r}
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[,%$\u20b9]/g,''));return isFinite(n)?n:0};
const PCT=[2,3,7,8,12,13,17,18,21,22];
const cellVals=l=>{const o=[];for(let p=0;p<23;p++){const t=String(l[4+p]==null?'':l[4+p]).trim(),bad=t===''||t.charAt(0)==='#';o.push(PCT.indexOf(p)>=0?(bad?null:num(t)):(bad?0:num(t)))}return o};
const chName=s=>String(s).replace(/\s*-\s*All$/i,'').replace(/\s*\(EU\)/i,'').replace(/^CRM\s+/i,'').replace(/whatsapp/i,'WhatsApp').trim();
const titleCase=s=>s.toLowerCase().replace(/\b\w/g,m=>m.toUpperCase());
function buildData(rows){
const hs=[];rows.forEach((r,i)=>{if(r.some(c=>String(c).trim().toLowerCase()==='channel'))hs.push(i)});
if(hs.length<2)throw new Error('Could not find the ALL block and pod blocks (rows with a CHANNEL header).');
let date='';rows.slice(0,4).forEach(r=>r.forEach(c=>{if(/^[A-Za-z]{3} \d{1,2}, \d{4}$/.test(String(c).trim()))date=String(c).trim()}));
const secs=hs.map((h,k)=>{const end=k+1<hs.length?hs[k+1]:rows.length;const recs={},order=[],tg={};
for(let r=h+1;r<end;r++){const l=rows[r],c=String(l[3]||'').trim();if(!c||!l.slice(4,9).some(x=>String(x).trim()!==''))continue;const n=chName(c);recs[n]=cellVals(l);order.push(n);if(l[1])tg[n]=num(l[1])}
let name='ALL';if(k>0){name='Pod '+(k+1);for(let r=h-1;r>=Math.max(0,h-4);r--){const v=rows[r].find(c=>c&&String(c).trim()&&!/^[\d.,%\s-]+$/.test(c));if(v){name=titleCase(String(v).trim());break}}}
return{name,recs,order,tg}});
const all=secs[0],pods=secs.slice(1);
const channels=[];pods.forEach(p=>p.order.forEach(c=>{if(channels.indexOf(c)<0)channels.push(c)}));
const targets={};channels.forEach(c=>{if(all.tg[c]!=null)targets[c]=all.tg[c]});
const Z=()=>cellVals([]);
const o={format:2,updated:new Date().toISOString(),date,channels,targets,all:{},pods:{}};
channels.forEach(c=>{o.all[c]=all.recs[c]||Z()});
pods.forEach(p=>{o.pods[p.name]={};channels.forEach(c=>{o.pods[p.name][c]=p.recs[c]||Z()})});
return o}

const $=id=>document.getElementById(id);
const Z23=Array(23).fill(0);
const n9=v=>[v[0],v[1],v[6],v[5],v[11],v[10],v[16],v[15],v[20]];
let VIEW='tot';
const AC='a0';
const VW={m0:{t:'M0',cols:'E-H',ach:3,lead:0,sale:1,f:[['M0 leads',0,'n'],['M0 sales',1,'n'],['M0 conversion',2,'c'],['M0 achievement',3,'a1']]},
m1:{t:'M1',cols:'I-M',ach:8,lead:6,sale:5,f:[['Sales (this month)',4,'n'],['Absolute sales',5,'n'],['M1 leads',6,'n'],['Conversion (abs)',7,'c'],['Achievement',8,'a0']]},
m2:{t:'M2',cols:'N-R',ach:13,lead:11,sale:10,f:[['Sales (this month)',9,'n'],['Absolute sales',10,'n'],['M2 leads',11,'n'],['Conversion (abs)',12,'c'],['Achievement',13,'a0']]},
m3:{t:'M3',cols:'S-W',ach:18,lead:16,sale:15,f:[['Sales (this month)',14,'n'],['Absolute sales',15,'n'],['M3 leads',16,'n'],['Conversion (abs)',17,'c'],['Achievement',18,'a0']]},
tot:{t:'Total',cols:'X-AA',ach:22,lead:19,sale:20,f:[['Total leads',19,'n'],['Total sales (Nov)',20,'n'],['Time-based conv.',21,'c'],['Time-based ach.',22,'a1']]}};
function setV(k){VIEW=k;render()}
function fm(v,t){if(v==null)return '-';if(t==='n')return f0(v);return v.toFixed(t==='c'?2:t==='a1'?1:0)+'%'}
let D=null,PEND=null;
const f0=x=>Math.round(x).toLocaleString(),f1=x=>(Math.round(x*10)/10).toFixed(1);
function bg(v){return v<50?'rgba(227,73,72,.4)':v<80?'rgba(227,73,72,.22)':v<100?'rgba(227,73,72,.09)':v<120?'rgba(42,120,214,.13)':v<200?'rgba(42,120,214,.26)':'rgba(42,120,214,.44)'}
function msg(t,c){$('msg').textContent=t;$('msg').className=c||''}
function gmsg(t,c){$('gm').textContent=t;$('gm').className=c||''}
function status(){if(!D)return;const u=D.updated?new Date(D.updated).toLocaleString():'';$('st').textContent='Sheet date: '+(D.date||'n/a')+(u?'  |  published '+u:'')}
function render(){
if(!D)return;
if(D.format!==2){$('out').innerHTML='<div class="pv">data.json is in the old format. Click Update data and upload the sheet CSV again.</div>';return}
const CH=D.channels,T=CH.map(c=>+((D.targets||{})[c])||0);
const pods=Object.keys(D.pods).map(n=>{const v=CH.map(c=>D.pods[n][c]||Z23);return{n,v,r:v.map(n9)}});
const all=CH.map(c=>n9(D.all[c]||Z23));
const co=r=>[r[2]+r[4]+r[6],r[3]+r[5]+r[7]];
const th=+$('th').value,mv=+$('mv').value/100,cp=+$('cp').value/100,ms=+$('ms').value;
const cell=pods.map(p=>p.r.map((r,j)=>{const[L,A]=co(r);return{L,A,ach:L&&T[j]?A/L/(T[j]/100)*100:0}}));
const qual=pods.map((p,i)=>{let a=0,e=0,s=0,x=0;p.r.forEach((r,j)=>{a+=cell[i][j].A;e+=cell[i][j].L*T[j]/100;s+=r[8];x+=r[0]*T[j]/100});return[e?a/e*100:0,x?s/x*100:0]});
const best=CH.map((c,j)=>{let b=-1,v=-1;pods.forEach((p,i)=>{const e=cell[i][j];if(e.A>=ms&&e.ach>v){v=e.ach;b=i}});return b});
const worst=CH.map((c,j)=>{let b=-1,v=1e9;pods.forEach((p,i)=>{const e=cell[i][j];if(e.L>=30&&e.ach<v){v=e.ach;b=i}});return b});
let net=0,gross=0;const un=CH.map((c,j)=>{const[L,A]=co(all[j]);const d=L*T[j]/100-A;net+=d;if(d>0)gross+=d;
let pl=0,pa=0;pods.forEach((p,i)=>{pl+=cell[i][j].L;pa+=cell[i][j].A});const ul=Math.max(0,L-pl),us=Math.max(0,A-pa);return{c,ul,us,ue:ul*T[j]/100}});
const UL=un.reduce((s,x)=>s+x.ul,0),US=un.reduce((s,x)=>s+x.us,0),UE=un.reduce((s,x)=>s+x.ue,0);
const cap=pods.map(p=>cp*p.r.reduce((s,r)=>s+r[0],0));
const cand=[];
CH.forEach((c,j)=>{const rec=pods.map((p,i)=>({i,...cell[i][j]})).filter(e=>e.A>=ms&&e.ach>=100).sort((a,b)=>b.ach-a.ach);
pods.forEach((p,g)=>{const e=cell[g][j];if(e.L<30||e.ach>=th)return;const r=rec.find(x=>x.i!==g);if(!r)return;
const n=Math.round(p.r[j][0]*mv),gain=r.A/r.L-e.A/e.L;if(n<1||gain<=0)return;cand.push({j,g,r:r.i,n,gain,why:`${p.n} is at ${f0(e.ach)}% of target (${e.A} sales on ${f0(e.L)} leads); ${pods[r.i].n} is at ${f0(r.ach)}% (${r.A} on ${f0(r.L)})${rec.length===1?' and is the only pod above target in this channel':''}.${p.r[j][1]===0?' '+p.n+' has no M0 sale yet.':''}`})})});
cand.sort((a,b)=>b.n*b.gain-a.n*a.gain);
cand.forEach(m=>{m.k=Math.min(m.n,Math.floor(cap[m.r]));cap[m.r]-=m.k;if(m.k<m.n)m.why+=' Reduced to fit '+pods[m.r].n+'\'s intake cap.'});
const mvs=cand.filter(m=>m.k>0);
const MS=mvs.reduce((s,m)=>s+m.k*m.gain,0),ML=mvs.reduce((s,m)=>s+m.k,0);
const lg=[['under 50%',.4,'227,73,72'],['50-79%',.22,'227,73,72'],['80-99%',.09,'227,73,72'],['100-119%',.13,'42,120,214'],['120-199%',.26,'42,120,214'],['200%+',.44,'42,120,214']];
const w=VW[VIEW],mn=(VIEW==='m0'||VIEW==='tot')?Math.min(ms,2):ms,ml=VIEW==='m0'?10:30;
const bestV=CH.map((c,j)=>{let b=-1,v=-1;pods.forEach((p,i)=>{const x=p.v[j];if(x[w.ach]!=null&&x[w.sale]>=mn&&x[w.ach]>v){v=x[w.ach];b=i}});return b});
const worstV=CH.map((c,j)=>{let b=-1,v=1e9;pods.forEach((p,i)=>{const x=p.v[j];if(x[w.ach]!=null&&x[w.lead]>=ml&&x[w.ach]<v){v=x[w.ach];b=i}});return b});
let h=(PEND?'<div class="pv">Preview of the uploaded file. Not published yet.</div>':'')+`<div class="k"><div><span>Net deficit</span><b>${f0(net)}</b><small>Gross ${f0(gross)} short, ${f0(gross-net)} surplus elsewhere</small></div>
<div><span>Leads owned by no pod</span><b>${f0(UL)}</b><small>${f0(US)} sales vs about ${f0(UE)} expected</small></div>
<div><span>Re-routing upside</span><b>+${f1(MS)}</b><small>sales from moving ${f0(ML)} M0 leads</small></div></div>
<div class="hh"><h2>Conversion by pod and channel</h2><div class="sg">${Object.keys(VW).map(k=>`<button class="${k===VIEW?'on':''}" onclick="setV('${k}')">${VW[k].t}</button>`).join('')}</div></div>
<p class="sub">${w.t} values as in the sheet (columns ${w.cols}). Colour follows the achievement value shown in each cell.</p>
<div class="w"><table class="h"><tr><th class="n"></th>${CH.map(c=>`<th>${c}</th>`).join('')}<th>Cohort quality (calc.)</th><th>Nov run-rate (calc.)</th></tr>`;
pods.forEach((p,i)=>{h+=`<tr><td class="n">${p.n}</td>`+p.v.map((x,j)=>{const a=x[w.ach];return `<td class="c${bestV[j]===i?' best':''}" style="background:${a==null?'var(--s)':bg(a)}">`+w.f.map((f,k)=>`<div class="r2${k===w.f.length-1?' a':''}"><span>${f[0]}</span><b${k===w.f.length-1&&x[w.sale]<mn?' class="it"':''}>${fm(x[f[1]],f[2])}</b></div>`).join('')+'</td>'}).join('')+`<td style="background:${bg(qual[i][0])};border-left:1px solid var(--b)"><span class="p">${f0(qual[i][0])}%</span></td><td style="background:${bg(qual[i][1])}"><span class="p">${f0(qual[i][1])}%</span></td></tr>`});
h+=`<tr class="t"><td class="n">Best</td>${bestV.map(i=>`<td>${i<0?'-':pods[i].n}</td>`).join('')}<td></td><td></td></tr><tr class="t"><td class="n">Weakest</td>${worstV.map(i=>`<td>${i<0?'-':pods[i].n}</td>`).join('')}<td></td><td></td></tr></table></div>
<div class="lg">${lg.map(l=>`<span><i style="background:rgba(${l[2]},${l[1]})"></i>${l[0]}</span>`).join('')}<span><i style="border:2px solid var(--t)"></i>best pod (${mn}+ sales)</span><span><em>italic</em> = under ${mn} sales</span><span>Calculated columns pool M1 to M3 from the sheet numbers</span></div>
<h2>Suggested lead re-routing</h2><p class="sub">Reasons use M1 to M3 pooled absolute sales divided by leads, compared with the time-based target.</p>
<div class="w"><table class="m"><tr><th>Channel</th><th>From</th><th>To</th><th class="r">M0 leads</th><th class="r">Gain / 100 leads</th><th class="r">Sales</th><th>Reason</th></tr>`;
h+=mvs.length?mvs.map(m=>`<tr><td>${CH[m.j]}</td><td>${pods[m.g].n}</td><td>${pods[m.r].n}</td><td class="r">${m.k}</td><td class="r">+${f1(m.gain*100)}</td><td class="r">+${f1(m.k*m.gain)}</td><td class="rs">${m.why}</td></tr>`).join(''):'<tr><td colspan="7">No moves meet the current rules.</td></tr>';
h+='</table></div>';
$('out').innerHTML=h;status()}

function handle(txt,name){
try{let d;if(/\.json$/i.test(name)||/^\s*\{/.test(txt)){d=JSON.parse(txt);if(!d.all||!d.pods||!d.channels||d.format!==2)throw new Error('JSON must be the new format (upload the sheet CSV to rebuild it)')}
else{d=buildData(parseCSV(txt));d.updated=new Date().toISOString()}
PEND=d;D=d;render();$('pub').disabled=false;
msg('Read '+Object.keys(d.pods).length+' pods, '+d.channels.length+' channels, sheet date '+(d.date||'n/a')+'. Check the preview, then publish.','ok');gmsg('')}
catch(e){msg('Could not read file: '+e.message,'e')}}
function readFile(f){if(!f)return;const r=new FileReader();r.onload=()=>handle(r.result,f.name);r.readAsText(f)}
$('fi').onchange=e=>readFile(e.target.files[0]);
const dz=$('dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');readFile(e.dataTransfer.files[0])};

function b64(s){return btoa(unescape(encodeURIComponent(s)))}
async function publish(){
const o=$('go').value.trim(),r=$('gr').value.trim(),b=$('gb').value.trim()||'main',p=$('gp').value.trim()||'data.json',tk=$('gt').value.trim();
if(!PEND)return gmsg('Load a file first.','e');
if(!o||!r||!tk)return gmsg('Owner, repo and token are required.','e');
try{localStorage.setItem('lc_cfg',JSON.stringify({o,r,b,p,t:$('gk').checked?tk:''}))}catch(e){}
const u='https://api.github.com/repos/'+o+'/'+r+'/contents/'+p,H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
$('pub').disabled=true;gmsg('Publishing...');
try{let sha;const g=await fetch(u+'?ref='+encodeURIComponent(b),{headers:H});
if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('Could not read the repo ('+g.status+'). Check the token, owner, repo and branch.');
const body={message:'Update lead data '+(PEND.date||''),content:b64(JSON.stringify(PEND)),branch:b};if(sha)body.sha=sha;
const pr=await fetch(u,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
const j=await pr.json();if(!pr.ok)throw new Error((j.message||pr.status)+(pr.status===403||pr.status===404?'. The token needs Contents: read and write on this repo.':''));
PEND=null;render();gmsg('Published. Live for everyone in about a minute (commit '+(j.commit&&j.commit.sha?j.commit.sha.slice(0,7):'')+').','ok')}
catch(e){gmsg(e.message,'e');$('pub').disabled=false}}
$('pub').onclick=publish;
$('ub').onclick=()=>{$('ad').hidden=!$('ad').hidden};
['th','mv','cp','ms'].forEach(i=>$(i).oninput=render);

(function init(){
let c={};try{c=JSON.parse(localStorage.getItem('lc_cfg')||'{}')}catch(e){}
const m=location.hostname.match(/^(.+)\.github\.io$/);
$('go').value=c.o||(m?m[1]:'');$('gr').value=c.r||(m?location.pathname.split('/')[1]||'':'');
if(c.b)$('gb').value=c.b;if(c.p)$('gp').value=c.p;if(c.t){$('gt').value=c.t;$('gk').checked=true}
fetch('data.json?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=d;render()}).catch(()=>{$('st').textContent='No data.json found yet. Click Update data and upload the sheet CSV.';$('ad').hidden=false});
})();
</script></body></html>
