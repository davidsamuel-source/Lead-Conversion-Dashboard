<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead conversion: pod insights</title>
<style>
:root{--bg:#fff;--s:#f3f2ee;--t:#1c1c1a;--t2:#5b5a55;--b:#d9d7cf;--ac:#2f8fd5;--nv:#2d3a52;--ok:#1a8a3a;--ln:rgba(60,60,60,.3);
--g0:#fff;--g1:#d4efdc;--g2:#6fc78f;--gn:#efeeea;--ct:#1c1c1a;--ct2:#33322f;color-scheme:light}
:root[data-theme=dark]{--bg:#14171c;--s:#1e232b;--t:#eceff3;--t2:#a9b1bd;--b:#343b46;--ac:#5aaef0;--nv:#3a79b8;--ok:#4cc07a;--ln:rgba(255,255,255,.25);
--g0:#1b1f26;--g1:#24503a;--g2:#2f8a58;--gn:#2a2f37;--ct:#f1f4f7;--ct2:#cdd5de;color-scheme:dark}
:root[data-theme=dark] .logo img{background:#fff;border-radius:8px;padding:3px 8px}
.tg{display:flex;align-items:center;gap:6px;margin-left:auto}
*{box-sizing:border-box}
body{margin:0 auto;padding:16px;background:var(--bg);color:var(--t);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1920px}
h1{font-size:20px;font-weight:600;margin:0;line-height:1.25}h2{font-size:16px;font-weight:600;margin:0}
p.sub{font-size:13px;color:var(--t2);margin:2px 0 8px}
button,input{font:inherit;color:var(--t)}
button,label.f{border:1px solid var(--b);background:var(--bg);padding:7px 12px;border-radius:6px;cursor:pointer;min-height:36px}
button:hover,label.f:hover{border-color:var(--ac)}:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.pr{background:var(--nv);border-color:var(--nv);color:#fff}button:disabled{opacity:.5;cursor:default}
input[type=number],input[type=text],input[type=password]{padding:6px 8px;border:1px solid var(--b);background:var(--bg);border-radius:6px;min-height:36px}
.top{position:relative;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;border-color:transparent;padding:6px 8px;color:var(--t2)}
.logo:hover,.logo[aria-expanded=true]{background:var(--s);border-color:var(--b)}
.logo img{height:32px;width:auto;display:block}
#st{color:var(--t2);font-size:13px}
#ad{position:absolute;z-index:30;left:0;top:calc(100% + 4px);width:min(620px,100%);background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#ad[hidden]{display:none}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{border:0;background:none;font-size:25px;line-height:1;padding:0 8px;color:var(--t2)}
.dz{border:1.5px dashed var(--b);border-radius:8px;padding:14px;text-align:center;color:var(--t2);background:var(--s)}.dz.on{border-color:var(--ac)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.fl{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--t2)}.fl input{width:100%}
.ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);align-self:end;min-height:36px}
.pa{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--t2)}
#msg,#gm{font-size:13px;color:var(--t2);margin-top:8px}.e{color:#d03b3b!important}.ok{color:var(--ok)!important}
.bar{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--s);padding:10px 12px;border-radius:8px}
.bar .tl{flex:1 1 140px;font-size:13px;color:var(--t2)}
label.set{font-size:13px;color:var(--t2);display:flex;align-items:center;gap:6px}label.set input{width:64px}
.pv{background:#fab219;color:#222;border-radius:6px;padding:6px 10px;font-size:13px;margin:10px 0}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.k>div{background:var(--s);border-radius:8px;padding:10px 14px}.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-top:2px}.pn small{margin:0}.ph .chip{background:var(--s)}.chip b{font-weight:600}.hh.first{margin-top:22px}.k span{font-size:13px;color:var(--t2);display:block}.k b{font-size:23px;font-weight:600}.k small{display:block;font-size:12px;color:var(--t2)}
.hh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 2px}
.sg{display:flex;border:1px solid var(--b);border-radius:6px;overflow:hidden}
.sg button{border:0;border-right:1px solid var(--b);border-radius:0;padding:6px 16px;flex:1}.sg button:last-child{border-right:0}.sg button.on{background:var(--nv);color:#fff}
.pod{margin-top:14px}.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}.ph b{font-size:15px;margin-right:4px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--b)}
.gr{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.c{border:1px solid var(--b);border-radius:8px;padding:8px 10px;min-width:0}
.ch{font-size:12px;font-weight:600;margin-bottom:4px}.bn{font-weight:600;font-size:14px}
.g0{background:var(--g0)}.g1{background:var(--g1)}.g2{background:var(--g2)}.gn{background:var(--gn)}.c,.chip{color:var(--ct)}
.c.best{outline:2px solid var(--t);outline-offset:-2px}
.r2{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:1.6}.r2 span{color:var(--ct2);white-space:nowrap}.r2 b{font-weight:500}
.r2.a{border-top:1px solid var(--ln);margin-top:3px;padding-top:3px;font-size:14px}.r2.a b{font-weight:600}.r2.a b.it{font-style:italic;font-weight:400}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--t2);margin-top:12px}.lg i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:4px;border:1px solid var(--b)}
.w{overflow-x:auto}
table.m{width:100%;border-collapse:collapse;font-size:13px}
table.m th{text-align:left;font-weight:500;color:var(--t2);font-size:12px;border-bottom:1px solid var(--b);padding:5px 6px}
table.m td{border-bottom:1px solid var(--b);padding:6px;vertical-align:top}.r{text-align:right!important}
td.rs{min-width:320px;color:var(--t2)}
@media(min-width:700px){body{padding:22px clamp(20px,3vw,56px)}h1{font-size:23px}.logo img{height:40px}.gr{grid-template-columns:repeat(4,minmax(0,1fr))}.sg button{flex:none}}
@media(min-width:900px){.k .wide{grid-column:span 2}}
@media(min-width:1600px){.gr{grid-template-columns:repeat(var(--n,8),minmax(0,1fr))}}
@media(max-width:699px){
.sg{width:100%}button{min-height:40px}
table.m thead{display:none}table.m,table.m tbody,table.m tr,table.m td{display:block;width:100%}
table.m tr{border:1px solid var(--b);border-radius:8px;margin-bottom:10px;padding:8px 10px}
table.m td{border:0;display:flex;justify-content:space-between;gap:12px;padding:3px 0}
table.m td::before{content:attr(data-l);color:var(--t2);font-size:12px}
table.m td.rs{display:block;min-width:0}table.m td.rs::before{display:block;margin-bottom:2px}}

<script>
function parseCSV(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}row.push(c);r.push(row);return r}
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[,%$\u20b9]/g,''));return isFinite(n)?n:0};
const PCT=[2,3,7,8,12,13,17,18,21,22];
const cellVals=l=>{const o=[];for(let p=0;p<23;p++){const t=String(l[4+p]==null?'':l[4+p]).trim(),bad=t===''||t.charAt(0)==='#';o.push(PCT.indexOf(p)>=0?(bad?null:num(t)):(bad?0:num(t)))}return o};
const chName=s=>String(s).replace(/\s*-\s*All$/i,'').replace(/\s*\(EU\)/i,'').replace(/^CRM\s+/i,'').replace(/whatsapp/i,'WhatsApp').trim();
const titleCase=s=>s.toLowerCase().replace(/\b\w/g,m=>m.toUpperCase());
function buildData(rows){
const hs=[];rows.forEach((r,i)=>{if(r.some(c=>String(c).trim().toLowerCase()==='channel'))hs.push(i)});
if(hs.length<2)throw new Error('Could not find the ALL block and pod blocks (rows with a CHANNEL header).');
let date='';rows.slice(0,4).forEach(r=>r.forEach(c=>{if(/^[A-Za-z]{3} \d{1,2}, \d{4}$/.test(String(c).trim()))date=String(c).trim()}));
const secs=hs.map((h,k)=>{const end=k+1<hs.length?hs[k+1]:rows.length;const recs={},order=[],tg={};let tp=null;
for(let r=h+1;r<end;r++){const l=rows[r],c=String(l[3]||'').trim();if(!c&&tp==null&&String(l[27]==null?'':l[27]).trim()!=='')tp=[num(l[27]),num(l[28]),num(l[29]),num(l[30])];if(!c||!l.slice(4,9).some(x=>String(x).trim()!==''))continue;const n=chName(c);recs[n]=cellVals(l);order.push(n);if(l[1])tg[n]=num(l[1])}
let name='ALL';if(k>0){name='Pod '+(k+1);for(let r=h-1;r>=Math.max(0,h-4);r--){const v=rows[r].find(c=>c&&String(c).trim()&&!/^[\d.,%\s-]+$/.test(c));if(v){name=titleCase(String(v).trim());break}}}
return{name,recs,order,tg,tp}});
const all=secs[0],pods=secs.slice(1);
const channels=[];pods.forEach(p=>p.order.forEach(c=>{if(channels.indexOf(c)<0)channels.push(c)}));
const targets={};channels.forEach(c=>{if(all.tg[c]!=null)targets[c]=all.tg[c]});
const Z=()=>cellVals([]);
const o={format:2,updated:new Date().toISOString(),date,channels,targets,all:{},pods:{}};
channels.forEach(c=>{o.all[c]=all.recs[c]||Z()});
o.allPending=all.tp;o.podPending={};
pods.forEach(p=>{o.podPending[p.name]=p.tp?p.tp.slice(0,3):null;o.pods[p.name]={};channels.forEach(c=>{o.pods[p.name][c]=p.recs[c]||Z()})});
return o}

const $=id=>document.getElementById(id);
const Z23=Array(23).fill(0);
const n9=v=>[v[0],v[1],v[6],v[5],v[11],v[10],v[16],v[15],v[20]];
let VIEW='tot';
const AC='a0';
const VW={m0:{t:'M0',cols:'E-H',ach:3,lead:0,sale:1,f:[['M0 leads',0,'n'],['M0 sales',1,'n'],['M0 conversion',2,'c'],['M0 achievement',3,'a1']]},
m1:{t:'M1',cols:'I-M',ach:8,lead:6,sale:5,f:[['Sales (this month)',4,'n'],['Absolute sales',5,'n'],['M1 leads',6,'n'],['Conversion (abs)',7,'c'],['Achievement',8,'a0']]},
m2:{t:'M2',cols:'N-R',ach:13,lead:11,sale:10,f:[['Sales (this month)',9,'n'],['Absolute sales',10,'n'],['M2 leads',11,'n'],['Conversion (abs)',12,'c'],['Achievement',13,'a0']]},
m3:{t:'M3',cols:'S-W',ach:18,lead:16,sale:15,f:[['Sales (this month)',14,'n'],['Absolute sales',15,'n'],['M3 leads',16,'n'],['Conversion (abs)',17,'c'],['Achievement',18,'a0']]},
tot:{t:'Total',cols:'X-AA',ach:22,lead:19,sale:20,f:[['Total leads',19,'n'],['Total sales (Nov)',20,'n'],['Time-based conv.',21,'c'],['Time-based ach.',22,'a1']]}};
function mergeCh(d,A,B,N){
const ch=d.channels;if(ch.indexOf(A)<0||ch.indexOf(B)<0)return d;
const tg=d.targets||{},ta=+tg[A],tb=+tg[B],tt=(isFinite(ta)&&isFinite(tb))?(ta===tb?ta:(ta+tb)/2):null;
const mg=(x,y)=>{x=x||Z23;y=y||Z23;const o=Array(23).fill(0);
[0,1,4,5,6,9,10,11,14,15,16,19,20].forEach(i=>o[i]=(x[i]||0)+(y[i]||0));
const r=(n,m)=>m?n/m*100:null,a=(c,t)=>c==null||!t?null:c/t*100;
o[2]=r(o[1],o[0]);o[7]=r(o[5],o[6]);o[12]=r(o[10],o[11]);o[17]=r(o[15],o[16]);o[21]=r(o[20],o[0]);
o[3]=a(o[2],tt/2);o[8]=a(o[7],tt);o[13]=a(o[12],tt);o[18]=a(o[17],tt);o[22]=a(o[21],tt);return o};
const fix=src=>{const o={};ch.forEach(c=>{if(c===B)return;o[c===A?N:c]=c===A?mg(src[A],src[B]):src[c]});return o};
const pods={};Object.keys(d.pods).forEach(n=>pods[n]=fix(d.pods[n]));
const targets={};ch.forEach(c=>{if(c!==B&&tg[c]!=null)targets[c===A?N:c]=c===A?tt:tg[c]});
return Object.assign({},d,{channels:ch.filter(c=>c!==B).map(c=>c===A?N:c),targets,all:fix(d.all),pods})}
const view=d=>mergeCh(d,'WhatsApp','Email','WhatsApp + Email');
function setV(k){VIEW=k;render()}
function fm(v,t){if(v==null)return '-';if(t==='n')return f0(v);return v.toFixed(t==='c'?2:t==='a1'?1:0)+'%'}
let D=null,PEND=null;
const f0=x=>Math.round(x).toLocaleString(),f1=x=>(Math.round(x*10)/10).toFixed(1);
const cls=v=>v==null?'gn':v<25?'g0':v<75?'g1':'g2';
function msg(t,c){$('msg').textContent=t;$('msg').className=c||''}
function gmsg(t,c){$('gm').textContent=t;$('gm').className=c||''}
function status(){if(!D)return;const u=D.updated?new Date(D.updated).toLocaleString():'';$('st').textContent='Sheet date: '+(D.date||'n/a')+(u?'  |  published '+u:'')}
function render(){
if(!D)return;
if(D.format!==2){$('out').innerHTML='<div class="pv">data.json is in the old format. Click the logo to open Settings and upload the sheet CSV again.</div>';return}
const CH=D.channels,T=CH.map(c=>+((D.targets||{})[c])||0);
const pods=Object.keys(D.pods).map(n=>{const v=CH.map(c=>D.pods[n][c]||Z23);return{n,v,r:v.map(n9)}});
const all=CH.map(c=>n9(D.all[c]||Z23));
const co=r=>[r[2]+r[4]+r[6],r[3]+r[5]+r[7]];
const th=+$('th').value,mv=+$('mv').value/100,cp=+$('cp').value/100,ms=+$('ms').value;
const cell=pods.map(p=>p.r.map((r,j)=>{const[L,A]=co(r);return{L,A,ach:L&&T[j]?A/L/(T[j]/100)*100:0}}));
const best=CH.map((c,j)=>{let b=-1,v=-1;pods.forEach((p,i)=>{const e=cell[i][j];if(e.A>=ms&&e.ach>v){v=e.ach;b=i}});return b});
const worst=CH.map((c,j)=>{let b=-1,v=1e9;pods.forEach((p,i)=>{const e=cell[i][j];if(e.L>=30&&e.ach<v){v=e.ach;b=i}});return b});
let net=0,gross=0;const un=CH.map((c,j)=>{const[L,A]=co(all[j]);const d=L*T[j]/100-A;net+=d;if(d>0)gross+=d;
let pl=0,pa=0;pods.forEach((p,i)=>{pl+=cell[i][j].L;pa+=cell[i][j].A});const ul=Math.max(0,L-pl),us=Math.max(0,A-pa);return{c,ul,us,ue:ul*T[j]/100}});
const UL=un.reduce((s,x)=>s+x.ul,0),US=un.reduce((s,x)=>s+x.us,0),UE=un.reduce((s,x)=>s+x.ue,0);
const cap=pods.map(p=>cp*p.r.reduce((s,r)=>s+r[0],0));
const cand=[];
CH.forEach((c,j)=>{const rec=pods.map((p,i)=>({i,...cell[i][j]})).filter(e=>e.A>=ms&&e.ach>=100).sort((a,b)=>b.ach-a.ach);
pods.forEach((p,g)=>{const e=cell[g][j];if(e.L<30||e.ach>=th)return;const r=rec.find(x=>x.i!==g);if(!r)return;
const n=Math.round(p.r[j][0]*mv),gain=r.A/r.L-e.A/e.L;if(n<1||gain<=0)return;cand.push({j,g,r:r.i,n,gain,why:`${p.n} is at ${f0(e.ach)}% of target (${e.A} sales on ${f0(e.L)} leads); ${pods[r.i].n} is at ${f0(r.ach)}% (${r.A} on ${f0(r.L)})${rec.length===1?' and is the only pod above target in this channel':''}.${p.r[j][1]===0?' '+p.n+' has no M0 sale yet.':''}`})})});
cand.sort((a,b)=>b.n*b.gain-a.n*a.gain);
cand.forEach(m=>{m.k=Math.min(m.n,Math.floor(cap[m.r]));cap[m.r]-=m.k;if(m.k<m.n)m.why+=' Reduced to fit '+pods[m.r].n+'\'s intake cap.'});
const mvs=cand.filter(m=>m.k>0);
const MS=mvs.reduce((s,m)=>s+m.k*m.gain,0),ML=mvs.reduce((s,m)=>s+m.k,0);
const w=VW[VIEW],mn=(VIEW==='m0'||VIEW==='tot')?Math.min(ms,2):ms,ml=VIEW==='m0'?10:30;
const bestV=CH.map((c,j)=>{let b=-1,v=-1;pods.forEach((p,i)=>{const x=p.v[j];if(x[w.ach]!=null&&x[w.sale]>=mn&&x[w.ach]>v){v=x[w.ach];b=i}});return b});
const worstV=CH.map((c,j)=>{let b=-1,v=1e9;pods.forEach((p,i)=>{const x=p.v[j];if(x[w.ach]!=null&&x[w.lead]>=ml&&x[w.ach]<v){v=x[w.ach];b=i}});return b});
const G='<div class="gr" style="--n:'+CH.length+'">';
const cellH=(x,j,i)=>{const last=w.f.length-1;return `<div class="c ${cls(x[w.ach])}${bestV[j]===i?' best':''}"><div class="ch">${CH[j]}</div>`+w.f.map((f,k)=>`<div class="r2${k===last?' a':''}"><span>${f[0]}</span><b${k===last&&x[w.sale]<mn?' class="it"':''}>${fm(x[f[1]],f[2])}</b></div>`).join('')+'</div>'};
const PP=D.podPending||{},AP=D.allPending||[],pv=v=>v==null?'-':f0(v);
const kp=`<div class="k"><div><span>Net deficit</span><b>${f0(net)}</b><small>Gross ${f0(gross)} short, ${f0(gross-net)} surplus elsewhere</small></div>
<div><span>Leads owned by no pod</span><b>${f0(UL)}</b><small>${f0(US)} sales vs about ${f0(UE)} expected</small></div>
<div><span>Re-routing upside</span><b>+${f1(MS)}</b><small>sales from moving ${f0(ML)} M0 leads</small></div>
<div class="wide"><span>Pending sales, all pods (sheet)</span><div class="pn"><div><small>Pending M1 sales</small><b>${pv(AP[0])}</b></div><div><small>Pending M2 sales</small><b>${pv(AP[1])}</b></div><div><small>Pending M3 sales</small><b>${pv(AP[2])}</b></div><div><small>Net deficit</small><b>${pv(AP[3])}</b></div></div></div></div>`;
let h=(PEND?'<div class="pv">Preview of the uploaded file. Not published yet.</div>':'')+kp+`<div class="hh first"><h2>Conversion by pod and channel</h2><div class="sg">${Object.keys(VW).map(k=>`<button class="${k===VIEW?'on':''}" onclick="setV('${k}')">${VW[k].t}</button>`).join('')}</div></div>`;
pods.forEach((p,i)=>{h+=`<section class="pod"><div class="ph"><b>${p.n}</b>${['M1','M2','M3'].map((m,k)=>`<span class="chip" title="Sales still needed to reach target. Negative means ahead of target.">Pending ${m} sales <b>${pv((PP[p.n]||[])[k])}</b></span>`).join('')}</div>${G}${p.v.map((x,j)=>cellH(x,j,i)).join('')}</div></section>`});
const bw=(t,arr)=>`<section class="pod"><div class="ph"><b>${t}</b></div>${G}${arr.map((i,j)=>`<div class="c gn"><div class="ch">${CH[j]}</div><div class="bn">${i<0?'-':pods[i].n}</div></div>`).join('')}</div></section>`;
h+=bw('Best pod by channel ('+mn+'+ sales)',bestV)+bw('Weakest pod by channel',worstV);
h+=`<div class="lg"><span><i class="g0"></i>0 to 25%</span><span><i class="g1"></i>25 to 75%</span><span><i class="g2"></i>75% and above</span><span><i class="gn"></i>blank in sheet</span><span><i style="border:2px solid var(--t)"></i>best pod</span><span><em>italic</em> = under ${mn} sales</span></div>
`;$('out').innerHTML=h;h=`<div class="hh"><h2>Suggested lead re-routing</h2></div><p class="sub">Reasons use M1 to M3 pooled absolute sales divided by leads, compared with the time-based target.</p>
<div class="w"><table class="m"><thead><tr><th>Channel</th><th>From</th><th>To</th><th class="r">M0 leads</th><th class="r">Gain / 100 leads</th><th class="r">Sales</th><th>Reason</th></tr></thead><tbody>`;
h+=mvs.length?mvs.map(m=>`<tr><td data-l="Channel">${CH[m.j]}</td><td data-l="From">${pods[m.g].n}</td><td data-l="To">${pods[m.r].n}</td><td class="r" data-l="M0 leads">${m.k}</td><td class="r" data-l="Gain / 100 leads">+${f1(m.gain*100)}</td><td class="r" data-l="Sales">+${f1(m.k*m.gain)}</td><td class="rs" data-l="Reason">${m.why}</td></tr>`).join(''):'<tr><td colspan="7">No moves meet the current rules.</td></tr>';
h+='</tbody></table></div>';
$('out2').innerHTML=h;status()}

function handle(txt,name){
try{let d;if(/\.json$/i.test(name)||/^\s*\{/.test(txt)){d=JSON.parse(txt);if(!d.all||!d.pods||!d.channels||d.format!==2)throw new Error('JSON must be the new format (upload the sheet CSV to rebuild it)')}
else{d=buildData(parseCSV(txt));d.updated=new Date().toISOString()}
PEND=d;D=view(d);render();$('pub').disabled=false;
msg('Read '+Object.keys(d.pods).length+' pods, '+d.channels.length+' channels, sheet date '+(d.date||'n/a')+'. Check the preview, then publish.','ok');gmsg('')}
catch(e){msg('Could not read file: '+e.message,'e')}}
function readFile(f){if(!f)return;const r=new FileReader();r.onload=()=>handle(r.result,f.name);r.readAsText(f)}
$('fi').onchange=e=>readFile(e.target.files[0]);
const dz=$('dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');readFile(e.dataTransfer.files[0])};

function b64(s){return btoa(unescape(encodeURIComponent(s)))}
async function publish(){
const o=$('go').value.trim(),r=$('gr').value.trim(),b=$('gb').value.trim()||'main',p=$('gp').value.trim()||'data.json',tk=$('gt').value.trim();
if(!PEND)return gmsg('Load a file first.','e');
if(!o||!r||!tk)return gmsg('Owner, repo and token are required.','e');
try{localStorage.setItem('lc_cfg',JSON.stringify({o,r,b,p,t:$('gk').checked?tk:''}))}catch(e){}
const u='https://api.github.com/repos/'+o+'/'+r+'/contents/'+p,H={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
$('pub').disabled=true;gmsg('Publishing...');
try{let sha;const g=await fetch(u+'?ref='+encodeURIComponent(b),{headers:H});
if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('Could not read the repo ('+g.status+'). Check the token, owner, repo and branch.');
const body={message:'Update lead data '+(PEND.date||''),content:b64(JSON.stringify(PEND)),branch:b};if(sha)body.sha=sha;
const pr=await fetch(u,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
const j=await pr.json();if(!pr.ok)throw new Error((j.message||pr.status)+(pr.status===403||pr.status===404?'. The token needs Contents: read and write on this repo.':''));
PEND=null;render();gmsg('Published. Live for everyone in about a minute (commit '+(j.commit&&j.commit.sha?j.commit.sha.slice(0,7):'')+').','ok')}
catch(e){gmsg(e.message,'e');$('pub').disabled=false}}
$('pub').onclick=publish;
const SUN='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintTheme(){const d=document.documentElement.dataset.theme==='dark';$('tg').innerHTML=(d?SUN:MOON)+'<span>'+(d?'Light mode':'Dark mode')+'</span>';$('tg').setAttribute('aria-pressed',String(d))}
$('tg').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('lc_theme',n)}catch(e){}paintTheme()};paintTheme();
function setOpen(o){$('ad').hidden=!o;$('lg').setAttribute('aria-expanded',String(o))}
$('lg').onclick=()=>setOpen($('ad').hidden);$('xc').onclick=()=>setOpen(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
['th','mv','cp','ms'].forEach(i=>$(i).oninput=render);

(function init(){
let c={};try{c=JSON.parse(localStorage.getItem('lc_cfg')||'{}')}catch(e){}
const m=location.hostname.match(/^(.+)\.github\.io$/);
$('go').value=c.o||(m?m[1]:'');$('gr').value=c.r||(m?location.pathname.split('/')[1]||'':'');
if(c.b)$('gb').value=c.b;if(c.p)$('gp').value=c.p;if(c.t){$('gt').value=c.t;$('gk').checked=true}
fetch('data.json?t='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{D=view(d);render()}).catch(()=>{$('st').textContent='No data.json found yet. Click the logo to open Settings and upload the sheet CSV.';setOpen(true)});
})();
</script></body></html>
